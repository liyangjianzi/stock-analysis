<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement planner</title>
<script src="/plotly.js"></script>
<style>
/* Colours and font copy retirement/report.py, so the planner and the report read as one product. */
:root{--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;
  --axis:#c3c2b7;--blue:#2a78d6;--track:#cde2fb;--good:#006300;--bad:#d03b3b;--amber:#eda100;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--grid);
  display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
header h1{font-size:1.2rem;margin:0}
header .meta{color:var(--ink2);font-size:.8rem;flex:1;min-width:260px}
header .meta a{color:var(--blue);cursor:pointer}
.dirty{display:none;color:var(--amber);font-weight:600;font-size:.85rem}
.dirty.on{display:inline}
button{font:inherit;border:1px solid var(--axis);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#report-status{font-size:.85rem;color:var(--ink2)}
#report-status a{color:var(--blue);font-weight:600}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--track);border-top-color:var(--blue);
  border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
main{display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,560px);gap:20px;
  max-width:1400px;margin:0 auto;padding:16px 24px}
@media (max-width:980px){main{grid-template-columns:1fr}}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:12px;flex-wrap:wrap}
nav.tabs button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;
  padding:8px 12px;color:var(--ink2)}
nav.tabs button.on{border-bottom-color:var(--blue);color:var(--ink);font-weight:600}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid rgba(11,11,11,.10);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:8px}
.card h4{margin:14px 0 6px;font-size:.85rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.field{padding:6px 0}
.field label{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);font-size:.85rem;margin-bottom:4px}
.field label b{color:var(--ink);font-variant-numeric:tabular-nums}
.field .help{color:var(--muted);font-size:.75rem;margin-top:2px}
.field .row{display:flex;gap:8px;align-items:center}
input[type=range]{flex:1;accent-color:var(--blue)}
input[type=number],input[type=text]{font:inherit;width:100%;padding:5px 8px;border:1px solid var(--axis);
  border-radius:6px;background:#fff;font-variant-numeric:tabular-nums}
.row input[type=number]{width:110px;flex:none}
.field.invalid input{border-color:var(--bad);background:#fff3f3}
.field.invalid label{color:var(--bad)}
.check{display:flex;gap:8px;align-items:center;padding:6px 0;color:var(--ink2)}
.radio{display:block;padding:4px 0}
table.changes{width:100%;border-collapse:collapse}
table.changes td{padding:3px 4px}
table.changes td:last-child{width:32px}
table.ages{border-collapse:collapse;margin:6px 0 10px;font-size:.8rem;font-variant-numeric:tabular-nums}
table.ages td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--grid)}
table.ages td:first-child{text-align:left;color:var(--ink2)}
table.ages td.best{font-weight:700;color:var(--good)}
.answer{padding:6px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.answer b{font-size:1.05rem}
.x{border:none;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px}
aside{position:sticky;top:70px;align-self:start}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0} .tiles .tile:nth-child(5){grid-column:1/-1}
.tile{background:var(--surface);border:1px solid rgba(11,11,11,.10);border-radius:10px;padding:10px 12px}
.tile .label{color:var(--ink2);font-size:.8rem}.tile .value{font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.78rem;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
#gauge{height:240px}#chart{height:420px}
.note{color:var(--muted);font-size:.78rem}
#error{display:none;background:#fff3f3;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:10px}
#results.stale{opacity:.45}
</style>
</head>
<body>
<header>
  <h1>Retirement planner</h1>
  <div class="meta"><span id="plan-path"></span> · balances: <span id="balances"></span>
    (<a id="reload" title="Re-read the holdings file">reload</a>)
    <span class="dirty" id="dirty">● unsaved changes</span></div>
  <span id="report-status"></span>
  <button id="revert" disabled>Revert</button>
  <button id="save" disabled>Save</button>
  <button id="report" class="primary">Save &amp; generate report</button>
</header>
<main>
  <section>
    <nav class="tabs" id="tabs"></nav>
    <div id="panels"></div>
  </section>
  <aside>
    <div id="error"></div>
    <div id="results">
      <div class="card" style="padding:4px"><div id="gauge"></div></div>
      <div class="tiles" id="tiles"></div>
      <div class="card" style="padding:4px"><div id="chart"></div></div>
      <p class="note" id="note"></p>
    </div>
  </aside>
</main>
<script>
"use strict";
const TABS = [["people", "People"], ["spending", "Spending"], ["education", "Education"], ["home", "Home"],
              ["investing", "Investing"], ["optimize", "Optimize"], ["compare", "Compare"], ["advanced", "Advanced"]];
const ACCOUNTS = [["pension", "Pension / LIRA"], ["rrsp", "RRSP"], ["tfsa", "TFSA"], ["nonreg", "Non-registered"]];
let original = null, draft = null, saved = null, strategies = {}, limits = {}, reportPaths = null, lastPreview = null;
let eduDefaults = {}, kidDefaults = {};   // from the server: inputs.defaults()
let activeTab = TABS.some(([k]) => "#" + k === location.hash) ? location.hash.slice(1) : "people";
let gen = 0, inflight = false, timer = null;
// Optimizer results, with the draft they were computed for (shown as out of date after an edit).
let target = 0.9, afford = null, benefits = null, drawdown = null, goal = "legacy", compared = null;

// ---- helpers --------------------------------------------------------------
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const money = x => x == null ? "–" : "C$" + Math.round(x).toLocaleString("en-CA");
function short(x) {
  if (x == null) return "–";
  const a = Math.abs(x), s = x < 0 ? "−" : "";
  if (a >= 1e6) return s + "C$" + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + "C$" + Math.round(a / 1e3) + "k";
  return s + "C$" + Math.round(a);
}
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
function get(obj, path) { return path.split(".").reduce((o, k) => o == null ? undefined : o[k], obj); }
function set(obj, path, value) {
  const keys = path.split("."), last = keys.pop();
  const parent = keys.reduce((o, k) => (o[k] = o[k] ?? {}), obj);
  if (value === undefined) delete parent[last]; else parent[last] = value;
}
// validate() names fields like "people[0].retire_age"; inputs use "people.0.retire_age".
const toPath = f => f.replace(/\[(\d+)\]/g, ".$1");

// ---- controls ---------------------------------------------------------------
// Each control carries data-path; edits write into `draft` and schedule a preview.
// opts: min, max, step, scale (display = value*scale), unit, nullable, help, structural
function fmtVal(v, o) {
  if (v == null) return "–";
  if (o.unit === "%") return (v * 100).toFixed(o.digits ?? 0) + "%";
  if (o.unit === "$") return money(v);
  return String(v);
}
// Percent fields store fractions; their inputs show value, min, max and step x100.
const scaleOf = o => o.unit === "%" ? 100 : 1;
const scaled = (x, o) => x == null ? "" : +(x * scaleOf(o)).toFixed(4);
function field(path, label, o, control, out = "") {
  return `<div class="field" data-field="${path}"><label>${esc(label)}${out}</label>${control}
    ${o.help ? `<div class="help">${esc(o.help)}</div>` : ""}</div>`;
}
function attrs(path, o) {
  return `data-path="${path}" data-scale="${scaleOf(o)}" ${o.structural ? "data-structural" : ""}
    ${o.nullable ? "data-nullable" : ""} ${o.optional ? "data-optional" : ""}
    ${o.min != null ? `min="${scaled(o.min, o)}"` : ""} ${o.max != null ? `max="${scaled(o.max, o)}"` : ""}
    step="${o.step != null ? scaled(o.step, o) : "any"}" value="${scaled(get(draft, path), o)}"`;
}
function slider(path, label, o) {
  const a = attrs(path, {step: 1, ...o});
  return field(path, label, o, `<div class="row"><input type="range" ${a}><input type="number" ${a}></div>`,
    ` <b id="out-${path}" data-unit="${o.unit ?? ""}" data-digits="${o.digits ?? 0}">${fmtVal(get(draft, path), o)}</b>`);
}
function number(path, label, o = {}) {
  return field(path, label, o, `<input type="number" ${attrs(path, o)} placeholder="${esc(o.placeholder ?? "")}">`);
}
const contribGrid = prefix => `<div class="grid2">${ACCOUNTS.map(([k, l]) =>
  number(`${prefix}.${k}`, l, {min: 0, step: 500, optional: true, placeholder: "0"})).join("")}</div>`;
function choice(path, label, options) {
  const v = get(draft, path) ?? "";
  return `<div class="field" data-field="${path}"><label>${esc(label)}</label>
    <select data-path="${path}">${options.map(([k, l]) =>
      `<option value="${k}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
}
function text(path, label) {
  return `<div class="field" data-field="${path}"><label>${esc(label)}</label>
    <input type="text" data-path="${path}" data-structural value="${esc(get(draft, path) ?? "")}"></div>`;
}

// ---- panels -----------------------------------------------------------------
function peoplePanel() {
  const end = draft.end_age;
  return draft.people.map((p, i) => {
    const P = `people.${i}`;
    return `<div class="card"><h3>${esc(p.name)}</h3>
      <div class="grid2">
        ${number(`${P}.age`, "Age today", {min: 18, max: end - 1, step: 1, structural: true})}
        ${choice(`${P}.sex`, "Sex (for life expectancy)", [["", "Not set (average)"], ["female", "Female"], ["male", "Male"]])}
        ${slider(`${P}.retire_age`, "Retire at", {min: p.age, max: end - 1, structural: true})}
        ${slider(`${P}.cpp_start_age`, "Start CPP at", {min: limits.cpp_start_age[0], max: limits.cpp_start_age[1],
                 help: "Later pays more each year, for life."})}
        ${slider(`${P}.oas_start_age`, "Start OAS at", {min: limits.oas_start_age[0], max: limits.oas_start_age[1],
                 help: "Later pays more each year, for life."})}
        ${slider(`${P}.rrif_start_age`, "RRSP becomes a RRIF at", {min: 50, max: limits.convert_by_age, help: "Only RRIF income at 65+ can be split and gets the pension credit."})}
        ${number(`${P}.salary`, "Salary while working (C$/yr)", {min: 0, step: 1000, nullable: true,
                 placeholder: "not set", help: "Taxes your non-registered payouts while you work."})}
        ${number(`${P}.cpp_at_65`, "CPP at 65 (C$/yr, optional)", {min: 0, step: 100, nullable: true, placeholder: "estimate from years worked",
                 help: "Prefer the figure from My Service Canada."})}
      </div>
      <h4>Saving each year while working (C$)</h4>
      ${contribGrid(`${P}.contributions`)}
    </div>`;
  }).join("");
}
function eventsCard() {
  const people = draft.people.map(p => [p.id, p.name]);
  const rows = (draft.events || []).map((e, j) => {
    const num = (key, step) => `<input type="number" data-path="events.${j}.${key}" data-nullable step="${step}"
        value="${e[key] ?? ""}" placeholder="–">`;
    const sel = (key, opts) => `<select data-path="events.${j}.${key}">${opts.map(([k, l]) =>
        `<option value="${k}" ${(e[key] ?? "") === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    return `<tr><td><input type="text" data-path="events.${j}.label" value="${esc(e.label || "")}"></td>
      <td>${sel("kind", [["cash", "Money in / out"], ["income", "Yearly income"]])}</td>
      <td>${num("amount", 1000)}</td><td>${num("year", 1)}</td><td>${num("every", 1)}</td><td>${num("until", 1)}</td>
      <td>${e.kind === "income" ? sel("person", people) : ""}</td>
      <td><button class="x" data-remove-event="${j}" title="Remove">×</button></td></tr>`;
  }).join("");
  return `<div class="card"><h3>One-time money and side income</h3>
      <table class="changes"><tr class="note"><td>What</td><td>Kind</td><td>C$ (− = out)</td><td>Year</td>
        <td>Every N yrs</td><td>Until</td><td>Whose</td><td></td></tr>${rows}</table>
      <button id="add-event" style="margin-top:6px">+ Add an event</button>
      <p class="note">Money in (e.g. an inheritance) is untaxed and saved; money out (a car, a renovation) is
        spent that year, repeating every N years until the end year. Yearly income (part-time work) is taxed
        like salary each year from the start to the end year.</p></div>`;
}
function spendingPanel() {
  const s = draft.spending;
  const rows = (s.changes || []).map((c, j) => `<tr>
      <td><input type="number" data-path="spending.changes.${j}.year" step="1" value="${c.year}"></td>
      <td><input type="number" data-path="spending.changes.${j}.amount" step="1000" value="${c.amount}"></td>
      <td><input type="text" data-path="spending.changes.${j}.label" value="${esc(c.label || "")}"></td>
      <td><button class="x" data-remove-change="${j}" title="Remove">×</button></td></tr>`).join("");
  return eventsCard() + `<div class="card"><h3>Yearly spending</h3>
      ${slider("spending.base", "After-tax spending (today's C$)", {min: 0, max: 300000, step: 1000, unit: "$"})}
      <h4>Dated changes</h4>
      <table class="changes"><tr class="note"><td>Year</td><td>Change (C$/yr)</td><td>What</td><td></td></tr>${rows}</table>
      <button id="add-change" style="margin-top:6px">+ Add a change</button>
    </div>
    <div class="card"><h3>Later life</h3><div class="grid2">
      ${slider("spending.slow_go_age", "Slow down at", {min: 60, max: 100, structural: true})}
      ${slider("spending.slow_go_share", "…spending this much", {min: 0.5, max: 1, step: 0.01, unit: "%"})}
      ${slider("spending.no_go_age", "Slow down more at", {min: 60, max: 100, structural: true})}
      ${slider("spending.no_go_share", "…spending this much", {min: 0.4, max: 1, step: 0.01, unit: "%"})}
      ${number("spending.care", "Care costs in the last years (C$/yr)", {min: 0, step: 1000})}
      ${draft.people.length === 2 ? slider("spending.survivor_share", "A survivor alone spends", {min: limits.survivor_share[0], max: limits.survivor_share[1], step: 0.01, unit: "%"}) : ""}
    </div></div>
    <div class="card"><h3>When markets move</h3>
      ${[["bad_market", "One cut when markets fall"], ["guardrails", "Guardrails: cut or raise in steps"]].map(([k, l]) =>
        `<label class="radio"><input type="radio" name="spending-rule" value="${k}" ${(s.rule || "bad_market") === k ? "checked" : ""}> ${l}</label>`).join("")}
      <div class="grid2">${(s.rule || "bad_market") === "guardrails" ? `
      ${slider("spending.guardrail_band", "Act when the withdrawal rate moves", {min: limits.guardrail_band[0], max: limits.guardrail_band[1], step: 0.01, unit: "%",
               help: "Above the starting rate by this much: cut. Below by this much: raise."})}
      ${slider("spending.guardrail_step", "…by a step of", {min: limits.guardrail_step[0], max: limits.guardrail_step[1], step: 0.01, unit: "%"})}
      ${number("spending.guardrail_stop_years", "No cuts in the last years", {min: 0, step: 1})}
      ${slider("spending.guardrail_floor", "Never below", {min: limits.guardrail_floor[0], max: limits.guardrail_floor[1], step: 0.05, unit: "%",
               help: "Share of the planned spending; a year that still can't be paid counts as short."})}
      ${slider("spending.guardrail_ceiling", "Never above", {min: limits.guardrail_ceiling[0], max: limits.guardrail_ceiling[1], step: 0.05, unit: "%"})}` : `
      ${slider("spending.bad_market_cut", "Cut spending by", {min: 0, max: 0.3, step: 0.01, unit: "%"})}
      ${slider("spending.bad_market_trigger", "…when investments drop below", {min: 0.5, max: 1, step: 0.01, unit: "%",
               help: "Share of their value on retirement day."})}`}
    </div></div>`;
}
const newKid = n => ({...kidDefaults, name: `Child ${n}`, age: 10});
function check(path, label, fallback = false) {
  const on = get(draft, path) ?? fallback;
  return `<label class="check"><input type="checkbox" data-path="${path}" ${on ? "checked" : ""}> ${esc(label)}</label>`;
}
function educationSummary(e) {
  if (!e) return "";
  const kids = e.kids.map(k => `<li>${esc(k.name)}: school ${k.school_years[0]}–${k.school_years[k.school_years.length - 1]},
      living ${k.living} at ${money(k.yearly_cost)}/yr${k.contributions > 0
        ? ` · contribute ${money(k.contributions)} more for ${money(k.grants)} of grant`
        : ` · no grant left to earn (${money(k.grant_left)} unclaimed)`}</li>`).join("");
  return `<div class="answer"><span>School costs:</span><b>${money(e.cost)}</b>
      <span class="note">RESP today ${money(e.balance)} · student grants ${money(e.student_grants)} ·
        you pay ${money(e.household - e.contributions)} plus ${money(e.contributions)} of RESP
        contributions (average future)</span></div>
    <ul class="note">${kids}</ul>`;
}
function educationPanel() {
  const e = draft.education;
  if (!e) return `<div class="card"><p class="note">No children's education in this plan.</p>
      <button id="add-education">Add children's education</button></div>`;
  const costs = {...eduDefaults.costs, ...(e.costs || {})};
  const kids = (e.kids || []).map((k, i) => {
    const K = `education.kids.${i}`;
    const opt = (v, label) => `<label class="radio"><input type="radio" name="living-${i}" data-path="${K}.living"
        value="${v}" ${k.living === v ? "checked" : ""}> ${label}</label>`;
    return `<div class="card"><h3>${esc(k.name)} <button class="x" data-remove-kid="${i}" title="Remove">×</button></h3>
      <div class="grid2">
        ${text(`${K}.name`, "Name")}
        ${number(`${K}.age`, "Age today", {min: 0, max: 30, step: 1, structural: true})}
        ${slider(`${K}.start_age`, "Starts university/college at", {min: limits.kid_start_age[0], max: limits.kid_start_age[1]})}
        ${slider(`${K}.years`, "Years of school", {min: limits.kid_years[0], max: limits.kid_years[1]})}
      </div>
      <h4>While studying</h4>
      ${opt("home", `Living at home (${money(costs.home)}/yr)`)}${opt("away", `Living away (${money(costs.away)}/yr)`)}
      ${number(`${K}.cesg_received`, "Government grant (CESG) received so far, from the RESP statement",
               {min: 0, max: limits.cesg_lifetime, step: 100, nullable: true, placeholder: "estimated: every year's grant collected"})}
    </div>`;
  }).join("");
  return `<div class="card"><h3>The plan</h3><div id="edu-summary">${educationSummary(lastPreview && lastPreview.education)}</div>
      <p class="note">The RESP pays school first; what it can't cover is your spending those years
        (from savings while you still work).</p></div>
    ${kids}<button id="add-kid" style="margin-bottom:14px">+ Add a child</button>
    <div class="card"><h3>Yearly cost per student (today's C$)</h3><div class="grid2">
      ${number("education.costs.home", "Living at home: tuition, fees, books", {min: 0, step: 500, placeholder: String(eduDefaults.costs.home)})}
      ${number("education.costs.away", "Living away: plus residence and food", {min: 0, step: 500, placeholder: String(eduDefaults.costs.away)})}
    </div></div>
    <div class="card"><h3>RESP</h3>
      ${check("education.contribute", `Contribute each January while it still earns the government grant (${pct(limits.cesg_rate)})`, eduDefaults.contribute)}
      <div class="grid2">
        ${number("education.resp_balance", "Balance today (C$)", {min: 0, step: 1000, nullable: true, placeholder: "from the holdings file"})}
        ${number("education.contributed", "Contributed so far (C$)", {min: 0, step: 1000, nullable: true, placeholder: "estimated from the grants"})}
        ${number("education.grants", "Grants received so far (C$)", {min: 0, step: 100, nullable: true, placeholder: "estimated"})}
      </div>
      ${number("education.childcare", "Child care paid a year (C$, already in spending)", {min: 0, step: 500, optional: true, placeholder: "0",
               help: "Day camps, after-school care, babysitting for children under 16: deducted by the lower earner"})}
      ${check("education.student_grant", `Apply for the Canada Student Grant (up to ${money(limits.student_grant_max)} a student-year when last year's family income is low)`, eduDefaults.student_grant)}
      <p class="note">Family income is your taxable income: RRSP/RRIF withdrawals count, TFSA withdrawals don't.
        Drawing "proportionally" (Investing tab) can keep it low enough during school years.</p>
      ${check("education.aip_to_rrsp", `Move leftover growth to the RRSP (up to ${money(limits.aip_rrsp_max)}) instead of paying tax + ${pct(limits.aip_extra_tax)}`, eduDefaults.aip_to_rrsp)}
      <p class="note">After the last child's school, your contributions come back tax-free and unused grants are repaid.</p>
    </div>`;
}
function homePanel() {
  const h = draft.home;
  if (!h) return `<div class="card"><p class="note">This plan has no home. Add a "home" section to plan.json to plan a downsize.</p></div>`;
  const down = h.downsize_age != null;
  const age0 = draft.people[0].age;
  return `<div class="card"><h3>Home</h3>
      ${number("home.value", "Value today (C$)", {min: 0, step: 10000})}
      <label class="check"><input type="checkbox" id="downsize" ${down ? "checked" : ""}> Plan to downsize</label>

// Scenario changes are the scalar fields that differ from the saved plan, as dotted paths.
// List items (events, kids, dated changes) are skipped: an index would point at the wrong
// item once the list changes. Only the fixed people list is addressed by index.
const SKIP_KEYS = ["saved_scenarios", "holdings", "balances", "_readme", "scenarios"];
const LIST_OK = p => p === "people";
function diffScalars(a, b, path = "", out = {changes: {}, skipped: false}) {
  const isObj = v => v !== null && typeof v === "object";
  for (const k of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    if (!path && SKIP_KEYS.includes(k)) continue;
    const p = path ? `${path}.${k}` : k, x = a?.[k], y = b?.[k];
    if (Array.isArray(x) && Array.isArray(y) && !LIST_OK(p)) {
      if (JSON.stringify(x) !== JSON.stringify(y)) out.skipped = true;
    } else if (isObj(x) && isObj(y) && Array.isArray(x) === Array.isArray(y) && (!Array.isArray(x) || x.length === y.length))
      diffScalars(x, y, p, out);
    else if (!isObj(x) && !isObj(y)) { if (x !== y && y !== undefined) out.changes[p] = y ?? null; }
    else out.skipped = true;
  }
  return out;
}
const staleNote = r => r && r.forDraft !== JSON.stringify(draft)

}
const PANELS = {people: peoplePanel, spending: spendingPanel, education: educationPanel, home: homePanel,

// ---- events -------------------------------------------------------------------
function readInput(el) {
  if (el.tagName === "SELECT") return el.value === "" ? null : el.value;
  if (el.type === "text" || el.type === "radio") return el.value;
  if (el.type === "checkbox") return el.checked;
  if (el.value === "") return el.hasAttribute("data-nullable") ? null : el.hasAttribute("data-optional") ? undefined : 0;
  return +(Number(el.value) / Number(el.dataset.scale || 1)).toFixed(6);
}
document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.path) return;
  const v = readInput(el);
  set(draft, el.dataset.path, v);
  // keep a slider and its number box in step
  if (el.type === "range" || el.type === "number")
    document.querySelectorAll(`[data-path="${el.dataset.path}"]`).forEach(o => { if (o !== el) o.value = el.value; });
  const out = document.getElementById("out-" + el.dataset.path);
  if (out) out.textContent = fmtVal(v, {unit: out.dataset.unit, digits: Number(out.dataset.digits)});
  changed();
});
// An edit that adds, removes or re-limits controls: redraw the form, then preview.
function edited() { render(); changed(); }
document.addEventListener("change", e => {
  const el = e.target;
  if (el.hasAttribute("data-structural")) render();     // other controls' limits depend on it
  if (el.name === "strategy") { draft.withdrawal.strategy = el.value; edited(); }
  if (el.name === "drawdown-goal") { goal = el.value; render(); }
  if (el.name === "spending-rule") { draft.spending.rule = el.value; edited(); }
  if (el.dataset.path && /^events\.\d+\.kind$/.test(el.dataset.path)) edited();   // show or hide "Whose"
  if (el.id === "downsize") {
    const age0 = draft.people[0].age;
    draft.home.downsize_age = el.checked ? Math.max(age0, Math.min(65, draft.end_age - 1)) : null;
    edited();
  }
  if (el.dataset.partner != null) {
    const p = draft.people[Number(el.dataset.partner)];
    p.contributions_when_partner_retired = el.checked ? clone(p.contributions || {}) : null;
    edited();
  }
});
document.addEventListener("click", e => {
  const el = e.target;
  if (el.dataset.tab) {
    activeTab = el.dataset.tab;
    history.replaceState(null, "", "#" + activeTab);
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === activeTab));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "panel-" + activeTab));
  }
  if (el.id === "save-scenario") {
    const name = ($("scenario-name").value || "").trim() || `Scenario ${(draft.saved_scenarios || []).length + 1}`;
    const d = diffScalars(original, draft);
    if (!Object.keys(d.changes).length) { alert("Change something first, then save it as a scenario."); return; }
    if (d.skipped) alert("Edits to lists (events, children, dated changes) and added or removed sections " +
                         "(home, education, ESPP) aren't saved in scenarios; the rest is.");
    const list = clone(draft.saved_scenarios || []);
    draft = clone(original);
    draft.saved_scenarios = [...list, {name, changes: d.changes}];
    edited();
  }
  if (el.dataset.applyScenario != null) {
    Object.entries(draft.saved_scenarios[Number(el.dataset.applyScenario)].changes || {})
      .forEach(([path, v]) => set(draft, path, v));
    edited();
  }
  if (el.dataset.removeScenario != null) { draft.saved_scenarios.splice(Number(el.dataset.removeScenario), 1); edited(); }
  if (el.id === "run-compare") runOptimizer(el, "/api/compare", r => compared = r, {});
  if (el.id === "add-event") {
    draft.events = draft.events || [];
    draft.events.push({label: "", kind: "cash", amount: -10000, year: draft.start_year + 1});
    edited();
  }
  if (el.dataset.removeEvent != null) { draft.events.splice(Number(el.dataset.removeEvent), 1); edited(); }
  if (el.id === "add-change") {
    draft.spending.changes = draft.spending.changes || [];
    draft.spending.changes.push({year: draft.start_year + 1, amount: 0, label: ""});
    edited();
  }
  if (el.id === "opt-afford") runOptimizer(el, "affordability", r => afford = r, {target});
  if (el.id === "opt-benefits") runOptimizer(el, "benefits", r => benefits = r, {});
  if (el.id === "opt-drawdown") runOptimizer(el, "drawdown", r => drawdown = r, {});
  if (el.dataset.apply) applyOptimizer(el.dataset.apply);
  if (el.dataset.addEspp != null) { draft.people[Number(el.dataset.addEspp)].espp = {rate: 0.1, cap: 25000, discount: 0.15}; edited(); }
  if (el.dataset.removeEspp != null) { draft.people[Number(el.dataset.removeEspp)].espp = null; edited(); }
  if (el.id === "add-education") { draft.education = {kids: [newKid(1)]}; edited(); }
  if (el.id === "add-kid") { draft.education.kids.push(newKid(draft.education.kids.length + 1)); edited(); }
  if (el.dataset.removeKid != null) { draft.education.kids.splice(Number(el.dataset.removeKid), 1); edited(); }
  if (el.dataset.removeChange != null) {
    draft.spending.changes.splice(Number(el.dataset.removeChange), 1);
    edited();
  }
});

document.addEventListener("input", e => {
  if (e.target.id !== "target") return;
  target = Number(e.target.value) / 100;
  $("target-out").textContent = pct(target);

async function runOptimizer(button, kind, keep, extra) {
  button.disabled = true;
  button.innerHTML = `<span class="spin"></span>Searching…`;
  const forDraft = JSON.stringify(draft);
  const url = kind.startsWith("/") ? kind : "/api/optimize/" + kind;
  try { keep({result: await api(url, {plan: draft, ...extra}), forDraft}); }
  catch (err) { keep({error: err.message, forDraft}); }
  render();
}
function applyOptimizer(kind) {
  if (kind === "spending") draft.spending.base = afford.result.max_spending;
  if (kind === "retire") draft.people.forEach(p => { p.retire_age += afford.result.retire_shift; });
  if (kind === "drawdown") {
    draft.withdrawal.strategy = "steady_income";
    draft.withdrawal.steady_income_target = drawdown.result.best[goal].target;
  }
  if (kind === "benefits") benefits.result.people.forEach((c, i) => {
    draft.people[i].cpp_start_age = c.best[0];
    draft.people[i].oas_start_age = c.best[1];
  });
  edited();
}

function isDirty() { return JSON.stringify(draft) !== JSON.stringify(original); }
// The saved plan's preview comes with the plan, so only an edited draft needs a run.
const needsPreview = () => isDirty() || !saved;
function changed() {
  const d = isDirty();
  $("dirty").classList.toggle("on", d);
  $("save").disabled = !d; $("revert").disabled = !d;
  gen++;
  clearTimeout(timer);
  if (needsPreview()) timer = setTimeout(preview, 400);
  else { showError(null); showResults(saved); }
}
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

// ---- server -------------------------------------------------------------------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({message: r.statusText}));
  if (!r.ok) throw Object.assign(new Error(data.message || r.statusText), {field: data.field});
  return data;
}
function showError(err) {
  document.querySelectorAll(".field.invalid").forEach(f => f.classList.remove("invalid"));
  $("error").style.display = err ? "block" : "none";
  $("results").classList.toggle("stale", !!err);
  if (!err) return;
  $("error").textContent = err.message;
  if (err.field) {
    const f = document.querySelector(`.field[data-field="${toPath(err.field)}"]`);
    if (f) f.classList.add("invalid");
  }
}
// One preview in flight at a time: an edit made meanwhile is picked up when it returns,
// so stale runs never queue up on the server.
async function preview() {
  if (inflight) return;
  inflight = true;
  const mine = gen;
  let res = null, error = null;
  try { res = await api("/api/preview", {plan: draft, previous: saved ? saved.success : null}); }
  catch (err) { error = err; }
  inflight = false;
  if (mine !== gen) { if (needsPreview()) preview(); return; }
  showError(error);
  if (res) showResults(res);
}
// The arrow follows the number; the colour says whether that is better (lower taxes are).
function delta(now, then, fmt, lowerIsBetter = false) {
  if (then == null || now == null || Math.round(now) === Math.round(then)) return "";
  const d = now - then, better = lowerIsBetter ? d < 0 : d > 0;
  return ` <span class="${better ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d))}</span>`;
}
function showResults(r) {
  lastPreview = r;
  const s = saved || {};
  const shortTile = r.first_short_age_bad == null ? "Never runs short" : `Runs short at ${r.first_short_age_bad}`;
  const tiles = [
    ["Legacy at " + draft.end_age, short(r.legacy) + delta(r.legacy, s.legacy, short), "After tax, home included · bad luck " + short(r.legacy_bad)],
    ["Investments at retirement", short(r.investments_at_retirement) + delta(r.investments_at_retirement, s.investments_at_retirement, short), "Average future"],
    ["Bad-luck future", shortTile, r.short_years_bad + " short year" + (r.short_years_bad === 1 ? "" : "s") + " (1-in-10 bad run)"],
    ["Lifetime taxes", short(r.lifetime_tax) + delta(r.lifetime_tax, s.lifetime_tax, short, true), "Income tax plus tax at death"],
    ...(r.lifespans ? [["Median age at death", r.lifespans.people.map(x => `${esc(x.name)} ${x.median_age_at_death}`).join(" · "),
        `Chance someone reaches 95: ${pct(r.lifespans.reach_95)}`]] : []),
  ];
  $("tiles").innerHTML = tiles.map(([a, b, c]) => `<div class="tile"><div class="label">${esc(a)}</div>
    <div class="value">${b}</div><div class="sub">${esc(c)}</div></div>`).join("");
  const cfg = {displaylogo: false, responsive: true};
  Plotly.react("gauge", r.gauge.data, r.gauge.layout, cfg);
  Plotly.react("chart", r.chart.data, Object.assign(r.chart.layout, {height: 420}), cfg);
  $("note").textContent = `Quick estimate over ${r.paths.toLocaleString()} futures, compared with the saved plan on the same futures. ` +
    `The report uses ${(reportPaths || r.paths).toLocaleString()} and adds the what-if suggestions.`;
  if ($("median")) $("median").textContent = pct(r.median_return, 2);
  if ($("edu-summary")) $("edu-summary").innerHTML = educationSummary(r.education);
  $("balances").textContent = r.balances_source;
}
function load(state) {
  ({education: eduDefaults, kid: kidDefaults} = state.defaults);
  const e = state.plan.education;      // show a child's defaulted fields instead of blanks
  if (e && e.kids) e.kids = e.kids.map(k => ({...kidDefaults, ...k}));
  original = state.plan; draft = clone(original); saved = state.saved;
  strategies = state.strategies; limits = state.limits; reportPaths = state.report_paths;
  $("plan-path").textContent = state.path;
  if (saved) $("balances").textContent = saved.balances_source;
  render(); changed();
  if (state.error) showError(state.error);
}

$("revert").onclick = () => { draft = clone(original); edited(); };
$("save").onclick = async () => {
  try { load(await api("/api/plan", {plan: draft})); } catch (err) { showError(err); }
};
$("reload").onclick = async () => {
  try { const st = await api("/api/reload-balances", {}); saved = st.saved; changed(); } catch (err) { showError(err); }
};
$("report").onclick = async () => {
  const status = $("report-status");
  try {
    load(await api("/api/report", {plan: draft}));     // saved; the report runs in the background
  } catch (err) { showError(err); return; }
  $("report").disabled = true;
  status.innerHTML = `<span class="spin"></span>Saved; building the report…`;
  const poll = setInterval(async () => {
    const job = await api("/api/report/status");
    if (job.state === "running") return;
    clearInterval(poll);
    $("report").disabled = false;
    if (job.state === "done") {
      status.innerHTML = `Report ready (${pct(job.success)}): <a href="${job.url}" target="_blank">open ↗</a>`;
      window.open(job.url, "_blank");
    } else {
      status.textContent = "Report failed: " + job.message;
    }
  }, 1000);
};

api("/api/plan").then(load).catch(showError);
</script>
</body>
</html>
